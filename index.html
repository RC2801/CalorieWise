        @keyframes content-fade-in { 0% { transform: translateY(-10px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes slide-up { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        .animate-toast-entry { animation: toast-entry 0.4s ease-out forwards; }
        .animate-content-fade-in { animation: content-fade-in 0.4s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }

        .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }

        // --- Helper Functions ---
        const checkDietaryFit = (itemIds, dietType) => {
          const items = FOOD_DATABASE.filter(f => itemIds.includes(f.id));
          for (let item of items) {
            if (dietType === 'jain' && !item.isJain) return false;
            if (dietType === 'vegan' && item.type !== 'vegan') return false;
            if (dietType === 'veg' && item.type === 'non-veg') return false;
          }
          return true;
        };

              {type === 'success' ? <Sparkles size={16} /> : <Info size={16} />} <span className="font-medium text-sm">{message}</span>
            </div>
          );
        };

          const [activeTab, setActiveTab] = useState('calculator'); // calculator | planner | cart | checkout
          const [selectedItems, setSelectedItems] = useState([]);
          const [cartItems, setCartItems] = useState([]); // { ...foodItem, qty }
          
          const [searchQuery, setSearchQuery] = useState('');
          const [suggestedDish, setSuggestedDish] = useState(null);
          const [toast, setToast] = useState(null);

          // Logic
          const filteredFood = useMemo(() => FOOD_DATABASE.filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase())), [searchQuery]);
          const totalNutrition = useMemo(() => selectedItems.reduce((acc, item) => ({ calories: acc.calories + item.calories, protein: acc.protein + item.protein, carbs: acc.carbs + item.carbs, fat: acc.fat + item.fat }), { calories: 0, protein: 0, carbs: 0, fat: 0 }), [selectedItems]);
          const cartTotal = useMemo(() => cartItems.reduce((acc, item) => acc + (item.price * item.qty), 0), [cartItems]);
          const cartCount = useMemo(() => cartItems.reduce((acc, item) => acc + item.qty, 0), [cartItems]);

          // Dish Detection
          useEffect(() => {
            const selectedIds = selectedItems.map(i => i.id);
            let foundDish = null;
            const matches = DISH_RULES.filter(dish => dish.ingredients.every(ingId => selectedIds.includes(ingId)));
            if (matches.length > 0) foundDish = matches.sort((a, b) => b.ingredients.length - a.ingredients.length)[0];
            
            if (foundDish && (!suggestedDish || suggestedDish.name !== foundDish.name)) {
              setSuggestedDish(foundDish);
              setToast({ message: `New Dish: ${foundDish.name}!`, type: 'success' });
            } else if (!foundDish) {
              setSuggestedDish(null);
            }
          }, [selectedItems]);

          // Cart Logic
          const handleAddIngredientsToCart = (ingredientIds, dishName) => {
             const newCart = [...cartItems];
             ingredientIds.forEach(id => {
                const food = FOOD_DATABASE.find(f => f.id === id);
                if (food) {
                   const existing = newCart.find(i => i.id === id);
                   if (existing) {
                      existing.qty += 1;
                   } else {
                      newCart.push({ ...food, qty: 1 });
                   }
                }
             });
             setCartItems(newCart);
             setToast({ message: `Ingredients for ${dishName} added to cart!`, type: 'success' });
          };

          const updateCartQty = (id, delta) => {
             const newCart = cartItems.map(item => {
                if (item.id === id) return { ...item, qty: Math.max(0, item.qty + delta) };
                return item;
             }).filter(item => item.qty > 0);
             setCartItems(newCart);
          };

          const handleAddItem = (item) => {
            if (selectedItems.find(i => i.id === item.id)) { setToast({ message: 'Item already added!', type: 'info' }); return; }
            setSelectedItems([...selectedItems, item]);
            setToast({ message: `${item.name} added`, type: 'info' });
          };
          
          const handleAddMeal = (ingredientIds) => {
            const newItems = ingredientIds.map(id => FOOD_DATABASE.find(f => f.id === id)).filter(item => item && !selectedItems.find(si => si.id === item.id));
            if (newItems.length > 0) {
              setSelectedItems([...selectedItems, ...newItems]);
              setToast({ message: 'Meal ingredients added!', type: 'success' });
              setActiveTab('calculator');
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else { setToast({ message: 'Ingredients already in list', type: 'info' }); }
          };

          // Diet Planner Component (Inline)
          const DietPlannerView = () => {
             const [goal, setGoal] = useState('lose');
             const [diet, setDiet] = useState('veg');
             const [plan, setPlan] = useState(null);
             const [viewingRecipe, setViewingRecipe] = useState(null);

             const generate = () => {
               const allowed = DISH_RULES.filter(dish => checkDietaryFit(dish.ingredients, diet));
               const rated = allowed.map(dish => {
                 const cals = dish.ingredients.reduce((sum, id) => sum + (FOOD_DATABASE.find(f => f.id === id)?.calories || 0), 0);
                 return { ...dish, totalCals: cals };
               });
               const sortFn = goal === 'gain' ? (a, b) => b.totalCals - a.totalCals : (a, b) => a.totalCals - b.totalCals;
               
               setPlan({
                 breakfast: rated.filter(d => d.category === 'Breakfast').sort(sortFn).slice(0, 3),
                 lunch: rated.filter(d => d.category === 'Lunch').sort(sortFn).slice(0, 3),
                 dinner: rated.filter(d => d.category === 'Dinner').sort(sortFn).slice(0, 3),
               });
             };

             const MealCard = ({ dish, color }) => (
                <div className="p-5 min-w-[280px] w-[280px] md:w-full rounded-xl border border-transparent shadow-sm hover:shadow-md transition-all bg-white relative overflow-hidden group shrink-0">
                   <div className={`absolute top-0 left-0 w-1 h-full ${color}`}></div>
                   <div className="flex justify-between items-start mb-2">
                      <h4 className="font-bold text-lg text-gray-800 mt-1">{dish.name}</h4>
                      <span className="text-2xl">{dish.icon}</span>
                   </div>
                   <p className="text-sm text-gray-500 mb-3 h-10 line-clamp-2">{dish.description}</p>
                   <div className="flex flex-col gap-2 mt-2">
                      <div className="flex justify-between items-center text-xs font-bold text-gray-900 bg-gray-100 px-2 py-1 rounded-md">
                         <span>{dish.totalCals} kcal</span>
                         <span>~${dish.ingredients.reduce((sum, id) => sum + (FOOD_DATABASE.find(f => f.id === id)?.price || 0), 0).toFixed(2)}</span>
                      </div>
                      <div className="flex gap-2 justify-end">
                         <button onClick={() => setViewingRecipe(dish)} className="text-xs p-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-gray-600"><BookOpen size={14}/></button>
                         <button onClick={() => handleAddMeal(dish.ingredients)} className="text-xs flex-1 py-2 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg font-semibold">Track</button>
                         <button onClick={() => handleAddIngredientsToCart(dish.ingredients, dish.name)} className="text-xs flex-1 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-lg font-semibold flex items-center justify-center gap-1"><ShoppingBag size={12}/> Shop</button>
                      </div>
                   </div>
                </div>
             );

             return (
               <div className="space-y-8 animate-content-fade-in pb-12">
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                     <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><Target className="text-green-500" /> Plan Your Diet</h2>
                     <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                           <label className="block text-sm font-semibold text-gray-600 mb-3">Goal</label>
                           <div className="flex gap-2">
                              {[{ id: 'lose', label: 'Lose' }, { id: 'gain', label: 'Gain' }, { id: 'maintain', label: 'Maintain' }].map(opt => (
                                 <button key={opt.id} onClick={() => setGoal(opt.id)} className={`flex-1 p-3 rounded-xl border text-sm font-bold transition-all ${goal === opt.id ? 'bg-green-50 border-green-500 text-green-700' : 'bg-white text-gray-500'}`}>{opt.label}</button>
                              ))}
                           </div>
                        </div>
                        <div>
                           <label className="block text-sm font-semibold text-gray-600 mb-3">Diet</label>
                           <div className="grid grid-cols-2 gap-2">
                              {[{ id: 'veg', label: 'Vegetarian' }, { id: 'non-veg', label: 'Non-Veg' }, { id: 'vegan', label: 'Vegan' }, { id: 'jain', label: 'Jain' }].map(opt => (
                                 <button key={opt.id} onClick={() => setDiet(opt.id)} className={`px-3 py-2 rounded-lg text-sm font-medium border transition-all ${diet === opt.id ? 'bg-amber-50 border-amber-500 text-amber-800' : 'bg-white text-gray-600'}`}>{opt.label}</button>
                              ))}
                           </div>
                        </div>
                     </div>
                     <button onClick={generate} className="w-full mt-6 bg-gray-900 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Sparkles size={18} className="text-yellow-400" /> Generate Menu</button>
                  </div>
                  {plan && (
                     <div className="animate-slide-up">
                        <div className="mb-8"><h3 className="text-lg font-bold text-gray-800 mb-4">Breakfast Options</h3><div className="flex md:grid md:grid-cols-3 gap-4 overflow-x-auto pb-4 px-1">{plan.breakfast.map((d, i) => <MealCard key={i} dish={d} color="bg-orange-400" />)}</div></div>
                        <div className="mb-8"><h3 className="text-lg font-bold text-gray-800 mb-4">Lunch Options</h3><div className="flex md:grid md:grid-cols-3 gap-4 overflow-x-auto pb-4 px-1">{plan.lunch.map((d, i) => <MealCard key={i} dish={d} color="bg-green-500" />)}</div></div>
                        <div className="mb-8"><h3 className="text-lg font-bold text-gray-800 mb-4">Dinner Options</h3><div className="flex md:grid md:grid-cols-3 gap-4 overflow-x-auto pb-4 px-1">{plan.dinner.map((d, i) => <MealCard key={i} dish={d} color="bg-blue-500" />)}</div></div>
                     </div>
                  )}
                  {viewingRecipe && <RecipeModal dish={viewingRecipe} onClose={() => setViewingRecipe(null)} />}
               </div>
             );
          };

          const CartView = () => (
             <div className="animate-content-fade-in max-w-4xl mx-auto pb-24">
                <h2 className="text-2xl font-bold mb-6 flex items-center gap-2"><ShoppingBag className="text-green-600"/> Your Cart</h2>
                {cartItems.length === 0 ? (
                   <div className="text-center py-20 bg-white rounded-2xl border-2 border-dashed border-gray-200">
                      <ShoppingBag size={48} className="mx-auto text-gray-300 mb-4" />
                      <p className="text-gray-500">Your cart is empty. Add ingredients from the Diet Planner!</p>
                      <button onClick={() => setActiveTab('planner')} className="mt-4 text-green-600 font-semibold hover:underline">Go to Planner</button>
                   </div>
                ) : (
                   <div className="grid md:grid-cols-3 gap-8">
                      <div className="md:col-span-2 space-y-4">
                         {cartItems.map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                               <div className="flex items-center gap-4">
                                  <span className="text-3xl bg-gray-50 p-2 rounded-lg">{item.icon}</span>
                                  <div>
                                     <h4 className="font-bold text-gray-800">{item.name}</h4>
                                     <p className="text-xs text-gray-500">${item.price.toFixed(2)} / {item.unit}</p>
                                  </div>
                               </div>
                               <div className="flex items-center gap-3">
                                  <button onClick={() => updateCartQty(item.id, -1)} className="p-1 rounded-full bg-gray-100 hover:bg-gray-200"><Minus size={14}/></button>
                                  <span className="font-bold w-4 text-center">{item.qty}</span>
                                  <button onClick={() => updateCartQty(item.id, 1)} className="p-1 rounded-full bg-green-100 text-green-700 hover:bg-green-200"><Plus size={14}/></button>
                                  <div className="w-16 text-right font-bold text-gray-700">${(item.price * item.qty).toFixed(2)}</div>
                               </div>
                            </div>
                         ))}
                      </div>
                      <div className="md:col-span-1">
                         <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-24">
                            <h3 className="font-bold text-gray-800 mb-4">Order Summary</h3>
                            <div className="space-y-2 mb-4 text-sm text-gray-600">
                               <div className="flex justify-between"><span>Subtotal ({cartCount} items)</span><span>${cartTotal.toFixed(2)}</span></div>
                               <div className="flex justify-between"><span>Est. Tax</span><span>${(cartTotal * 0.08).toFixed(2)}</span></div>
                               <div className="flex justify-between font-bold text-lg text-gray-900 pt-2 border-t"><span>Total</span><span>${(cartTotal * 1.08).toFixed(2)}</span></div>
                            </div>
                            <button onClick={() => setActiveTab('checkout')} className="w-full bg-[#0071DC] hover:bg-[#005bb5] text-white py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                              Transfer to Walmart <ExternalLink size={16}/>
                            </button>
                         </div>
                      </div>
                   </div>
                )}
             </div>
          );

          const CheckoutView = () => {
             return (
               <div className="animate-content-fade-in max-w-2xl mx-auto pb-24 text-center">
                  <button onClick={() => setActiveTab('cart')} className="mb-6 flex items-center gap-1 text-gray-500 hover:text-gray-900 font-medium"><ArrowRight className="rotate-180" size={16}/> Back to Cart</button>
                  
                  <div className="bg-white p-10 rounded-2xl shadow-sm border border-gray-100">
                     <div className="w-20 h-20 bg-[#0071DC] rounded-full flex items-center justify-center mx-auto mb-6">
                        <ShoppingBag size={40} className="text-white" />
                     </div>
                     <h2 className="text-2xl font-bold mb-2 text-gray-900">Transfer Cart to Walmart</h2>
                     <p className="text-gray-500 mb-8 max-w-md mx-auto text-sm">
                        To ensure you get the exact items (e.g., separating "Cornflakes" from "Milk"), please add each item to your Walmart cart individually below.
                     </p>
                     
                     <div className="bg-gray-50 p-4 rounded-xl mb-8 text-left max-h-96 overflow-y-auto">
                        <h4 className="text-xs font-bold text-gray-400 uppercase mb-4 sticky top-0 bg-gray-50 pb-2 border-b">Your Shopping List</h4>
                        <div className="space-y-3">
                           {cartItems.map((item, i) => (
                             <div key={i} className="flex items-center justify-between bg-white p-3 rounded-lg shadow-sm border border-gray-100">
                               <div className="flex items-center gap-3">
                                 <span className="text-2xl">{item.icon}</span>
                                 <div className="text-left">
                                   <p className="font-bold text-gray-800 text-sm">{item.name}</p>
                                   <p className="text-xs text-gray-500">Qty: {item.qty}</p>
                                 </div>
                               </div>
                               <a 
                                 href={`https://www.walmart.com/search?q=${encodeURIComponent(item.name)}`} 
                                 target="_blank" 
                                 rel="noreferrer"
                                 className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-1"
                               >
                                 Find Item <ExternalLink size={12} />
                               </a>
                             </div>
                           ))}
                        </div>
                     </div>

                     <p className="text-xs text-gray-400 mt-4">Clicking "Find Item" opens a specific search for that product in a new tab.</p>
                  </div>
               </div>
             );
          };

          return (
            <div className="min-h-screen bg-[#F7F7F7] font-sans text-gray-800">
              {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
              <header className="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-100">
                <div className="max-w-6xl mx-auto px-4 pt-4 pb-0">
                  <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-2">
                      <div className="bg-green-500 p-2 rounded-lg text-white"><ChefHat size={24} /></div>
                      <h1 className="text-xl font-bold tracking-tight text-gray-900">CalorieWise</h1>
                    </div>
                  </div>
                  <div className="flex gap-6 border-b border-gray-100 overflow-x-auto">
                    {[
                      { id: 'calculator', label: 'Calculator', icon: <Utensils size={18} /> },
                      { id: 'planner', label: 'Diet Planner', icon: <Calendar size={18} /> },
                      { id: 'cart', label: `Cart (${cartCount})`, icon: <ShoppingBag size={18} /> }
                    ].map(tab => (
                       <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`pb-3 text-sm font-semibold flex items-center gap-2 border-b-2 transition-colors whitespace-nowrap ${activeTab === tab.id ? 'border-green-500 text-green-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                          {tab.icon} {tab.label}
                       </button>
                    ))}
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 py-6">
                {activeTab === 'calculator' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-content-fade-in">
                    <section className="lg:col-span-7 space-y-6">
                      <div className="relative group">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><Search size={20} /></div>
                        <input type="text" placeholder="Search foods..." className="block w-full pl-10 pr-3 py-4 border-none rounded-xl bg-white shadow-sm ring-1 ring-gray-200 focus:ring-2 focus:ring-green-500 transition-all outline-none text-lg" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        {filteredFood.map(item => {
                          const isSelected = selectedItems.find(i => i.id === item.id);
                          return (
                            <button key={item.id} onClick={() => handleAddItem(item)} disabled={isSelected} className={`relative overflow-hidden group flex flex-col items-center p-4 rounded-2xl transition-all duration-300 ${isSelected ? 'bg-gray-100 opacity-60' : 'bg-white hover:shadow-md hover:-translate-y-1'}`}>
                              <div className={`text-4xl mb-3 p-3 rounded-full ${item.color}`}>{item.icon}</div>
                              <h3 className="font-semibold text-gray-800">{item.name}</h3>
                              <p className="text-sm text-green-600 font-medium">{item.calories} kcal</p>
                              {!isSelected && <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity"><div className="bg-green-500 text-white p-1 rounded-full"><Plus size={16} /></div></div>}
                            </button>
                          );
                        })}
                      </div>
                    </section>
                    <section className="lg:col-span-5 space-y-6">
                       <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                          <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span>Selected Ingredients</span><span className="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full">{selectedItems.length}</span></h2>
                          <div className="flex flex-wrap gap-2">{selectedItems.map(item => (<div key={item.id} className="animate-pop-in flex items-center gap-2 bg-gray-50 border border-gray-200 pl-3 pr-2 py-2 rounded-full"><span>{item.icon}</span><span className="text-sm font-medium">{item.name}</span><button onClick={() => setSelectedItems(selectedItems.filter(i => i.id !== item.id))}><X size={14} /></button></div>))}</div>
                       </div>
                       {suggestedDish && (
                          <div className="animate-slide-up bg-gradient-to-br from-yellow-50 to-orange-50 rounded-2xl p-6 border border-yellow-200 shadow-sm relative overflow-hidden">
                             <div className="absolute top-0 right-0 p-4 opacity-10"><ChefHat size={120} className="text-yellow-600" /></div>
                             <div className="relative z-10">
                                <h3 className="text-2xl font-bold text-gray-900 mb-1">{suggestedDish.name}</h3>
                                <div className="flex items-center gap-4 bg-white/60 p-3 rounded-xl mt-4"><span className="text-4xl">{suggestedDish.icon}</span><div className="text-xl font-bold text-green-700">{selectedItems.reduce((acc, i) => acc + i.calories, 0)} kcal</div></div>
                             </div>
                          </div>
                       )}
                       <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                          <div className="grid grid-cols-3 gap-2"><div className="text-center p-2 bg-blue-50 rounded-lg"><span className="block text-xs font-bold text-gray-500">PRO</span><span className="font-bold">{totalNutrition.protein.toFixed(1)}g</span></div><div className="text-center p-2 bg-green-50 rounded-lg"><span className="block text-xs font-bold text-gray-500">CARB</span><span className="font-bold">{totalNutrition.carbs.toFixed(1)}g</span></div><div className="text-center p-2 bg-yellow-50 rounded-lg"><span className="block text-xs font-bold text-gray-500">FAT</span><span className="font-bold">{totalNutrition.fat.toFixed(1)}g</span></div></div>
                          <div className="mt-6 pt-6 border-t text-right text-3xl font-bold text-green-600">{totalNutrition.calories.toFixed(0)} kcal</div>
                       </div>
                    </section>
                  </div>
                )}
                {activeTab === 'planner' && <DietPlannerView />}
                {activeTab === 'cart' && <CartView />}
                {activeTab === 'checkout' && <CheckoutView />}
              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<CalorieWise />);
    </script>
</body>
</html>
